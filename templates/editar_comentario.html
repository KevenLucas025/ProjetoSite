{% extends "base.html" %}

{% block content %}
<section class="comentarios-pagina">
    <div class="comentarios-container">
        <div class="comentario-form-card">
            <h2>Editar comentário</h2>

            <form method="post">
                {% csrf_token %}

                <div class="campo-armadilha" aria-hidden="true">
                    {{ form.website }}
                </div>

                {% for field in form %}
                    {% if field.name != "website" %}
                        <div class="campo-comentario">
                            <label for="{{ field.id_for_label }}">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% for erro in field.errors %}
                                <p class="comentario-erro">{{ erro }}</p>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endfor %}

                <button type="submit" class="btn-enviar-comentario">
                    Salvar alterações
                </button>

                <a href="{% url 'comentarios' %}"
                   class="btn-cancelar-edicao">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</section>
{% endblock %}
